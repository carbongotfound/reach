<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="Inter Variable, Inter, Segoe UI, system-ui, sans-serif"><title>How Reach works</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5d5d5d"/></marker></defs><rect width="960" height="330" fill="#ffffff"/><rect x="20" y="30" width="120" height="70" rx="8" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5"/><text x="34" y="56" font-size="15" font-weight="600" fill="#0d0d0d">You</text><text x="34" y="78" font-size="13" fill="#5d5d5d">type a task,</text><text x="34" y="96" font-size="13" fill="#5d5d5d">approve or stop</text><rect x="180" y="20" width="240" height="110" rx="8" fill="#ebf3fc" stroke="#0f6cbd" stroke-width="1.5"/><text x="194" y="46" font-size="15" font-weight="600" fill="#0d0d0d">Reach app</text><text x="194" y="68" font-size="13" fill="#5d5d5d">timeline and live view</text><text x="194" y="86" font-size="13" fill="#5d5d5d">approval cards</text><text x="194" y="104" font-size="13" fill="#5d5d5d">Stop, Ctrl+Alt+Esc</text><text x="194" y="122" font-size="13" fill="#5d5d5d">run log and replay</text><rect x="540" y="30" width="200" height="90" rx="8" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5"/><text x="554" y="56" font-size="15" font-weight="600" fill="#0d0d0d">Agent CLI</text><text x="554" y="78" font-size="13" fill="#5d5d5d">Claude Code or Codex,</text><text x="554" y="96" font-size="13" fill="#5d5d5d">signed in with your</text><text x="554" y="114" font-size="13" fill="#5d5d5d">own account</text><rect x="800" y="30" width="140" height="90" rx="8" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5"/><text x="814" y="56" font-size="15" font-weight="600" fill="#0d0d0d">The model</text><text x="814" y="78" font-size="13" fill="#5d5d5d">Anthropic (Claude)</text><text x="814" y="96" font-size="13" fill="#5d5d5d">or OpenAI</text><text x="814" y="114" font-size="13" fill="#5d5d5d">(ChatGPT)</text><rect x="180" y="200" width="240" height="110" rx="8" fill="#ebf3fc" stroke="#0f6cbd" stroke-width="1.5"/><text x="194" y="226" font-size="15" font-weight="600" fill="#0d0d0d">Reach engine</text><text x="194" y="248" font-size="13" fill="#5d5d5d">approval check before</text><text x="194" y="266" font-size="13" fill="#5d5d5d">risky presses</text><text x="194" y="284" font-size="13" fill="#5d5d5d">pause while you use the PC</text><text x="194" y="302" font-size="13" fill="#5d5d5d">stop at once</text><rect x="540" y="210" width="200" height="90" rx="8" fill="#fafafa" stroke="#d4d4d4" stroke-width="1.5"/><text x="554" y="236" font-size="15" font-weight="600" fill="#0d0d0d">Your Windows apps</text><text x="554" y="258" font-size="13" fill="#5d5d5d">Excel, Notepad, forms,</text><text x="554" y="276" font-size="13" fill="#5d5d5d">any window</text><line x1="140" y1="65" x2="178" y2="65" stroke="#5d5d5d" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><line x1="422" y1="75" x2="538" y2="75" stroke="#5d5d5d" stroke-width="1.5" marker-end="url(#a)"/><text x="480.0" y="67" font-size="12" fill="#5d5d5d" text-anchor="middle">task, replies</text><line x1="742" y1="75" x2="798" y2="75" stroke="#5d5d5d" stroke-width="1.5" marker-end="url(#a)"/><text x="770.0" y="67" font-size="12" fill="#5d5d5d" text-anchor="middle">HTTPS</text><line x1="620" y1="122" x2="425" y2="222" stroke="#5d5d5d" stroke-width="1.5" marker-end="url(#a)"/><text x="560" y="172" font-size="12" fill="#5d5d5d" text-anchor="start">tool calls (MCP, this PC only)</text><line x1="422" y1="262" x2="538" y2="262" stroke="#5d5d5d" stroke-width="1.5" marker-end="url(#a)"/><text x="480" y="236" font-size="12" fill="#5d5d5d" text-anchor="middle">UI Automation,</text><text x="480" y="252" font-size="12" fill="#5d5d5d" text-anchor="middle">then mouse, keys</text><line x1="300" y1="132" x2="300" y2="198" stroke="#5d5d5d" stroke-width="1.5" marker-end="url(#a)" marker-start="url(#a)"/><text x="310" y="170" font-size="12" fill="#5d5d5d" text-anchor="start">cards, Stop</text></svg>
