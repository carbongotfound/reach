[package]
name = "reach-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
windows.workspace = true
jpeg-encoder = "0.7"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync"], optional = true }

[features]
# Loopback HTTP + MCP server (used by the reach binary and the app).
server = ["dep:axum", "dep:tokio"]
