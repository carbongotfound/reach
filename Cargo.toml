[workspace]
resolver = "2"
members = ["crates/reach-core", "crates/reach", "app/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_UI_Accessibility", "Win32_System_Com",
  "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Threading", "Win32_System_ProcessStatus",
  "Win32_UI_Shell", "Win32_System_Registry", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_System_LibraryLoader", "Win32_Media", "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp", "Win32_Graphics_Dwm",
  "Win32_System_SystemInformation", "Win32_System_Environment", "Win32_System_Com_StructuredStorage",
  "Win32_Devices_Display", "Win32_Security_WinTrust", "Win32_UI_Shell_PropertiesSystem",
  "Win32_Storage_EnhancedStorage", "Win32_Storage_Packaging_Appx", "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
