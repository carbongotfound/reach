name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        shell: pwsh
        run: ./build.ps1
      - name: Smoke test
        shell: pwsh
        run: ./reach.exe help | Select-Object -First 3
      - uses: actions/upload-artifact@v4
        with:
          name: reach
          path: reach.exe
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: reach.exe
          generate_release_notes: true
