# Windows build: tests, the app's NSIS installer, a portable app exe and the reach CLI.
# Runs only when a v* tag is pushed. It uploads the files as a build artifact and makes a DRAFT
# GitHub release with them and SHA256SUMS.txt; a person publishes the draft after checking it.
# Builds are unsigned (see docs/signing.md).
name: build

on:
  push:
    tags: ['v*']

permissions: {}  # nothing by default; the one job below asks for what it needs

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write  # read the code, and create the draft release with its files
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      # the app crate embeds app/dist, so the tests need the frontend built first
      - name: Build the frontend
        working-directory: app
        run: npm run build

      - name: Unit tests
        run: cargo test --release -p reach-core -p reach-app

      - name: Build the installer (also builds the frontend and the app exe)
        working-directory: app
        run: npx tauri build --bundles nsis

      - name: Build the reach CLI
        run: cargo build --release -p reach

      - name: Collect files
        shell: pwsh
        run: |
          $v = (Get-Content app/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist-release | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist-release/
          Copy-Item target/release/reach-app.exe "dist-release/Reach-$v-portable.exe"
          Copy-Item target/release/reach.exe "dist-release/reach-cli-$v.exe"
          Get-ChildItem dist-release | ForEach-Object { "{0}  {1:n1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-FileHash dist-release/*.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist-release/SHA256SUMS.txt
          Get-Content dist-release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: reach-windows
          path: dist-release/*

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $v = '${{ github.ref_name }}'.TrimStart('v')
          $s = (Get-Content CHANGELOG.md -Raw) -split '(?m)^## ' | Where-Object { $_ -like "$v*" } | Select-Object -First 1
          if (-not $s) { throw "CHANGELOG.md has no section for $v" }
          ($s -split "`n", 2)[1].Trim() | Set-Content release-notes.md

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: Reach ${{ github.ref_name }} (public beta)
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}  # v0.4.0-beta.1 is a beta; v0.3.0 is a normal release the updater offers
          files: dist-release/*
